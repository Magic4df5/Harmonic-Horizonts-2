<!-- static/snowflakes.html -->
<style>
.snowflake {
    position: fixed;
    top: -10px;
    color: #87CEEB; /* Голубой цвет */
    font-size: 20px;
    text-shadow: 0 0 5px #ADD8E6;
    user-select: none;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.8;
}
</style>

<div id="snowflakes-container"></div>

<script>
// Создание снежинок
function createSnowflake() {
    const snowflake = document.createElement('div');
    snowflake.innerHTML = '❄';
    snowflake.classList.add('snowflake');

    // Позиция
    snowflake.style.left = Math.random() * 100 + 'vw';
    snowflake.style.fontSize = (Math.random() * 20 + 10) + 'px'; // Размер 10-30px
    snowflake.style.opacity = Math.random() * 0.7 + 0.3;

    // Анимация
    const duration = Math.random() * 5 + 5; // 5-10 секунд
    snowflake.style.animation = `fall ${duration}s linear infinite`;

    document.getElementById('snowflakes-container').appendChild(snowflake);

    // Удаление после завершения анимации
    setTimeout(() => {
        snowflake.remove();
    }, duration * 1000);
}

// CSS для анимации
const style = document.createElement('style');
style.innerHTML = `
@keyframes fall {
    0% {
        transform: translateY(-10px) rotate(0deg);
    }
    100% {
        transform: translateY(100vh) rotate(360deg);
    }
}
`;
document.head.appendChild(style);

// Создаем снежинки каждые 200ms
setInterval(createSnowflake, 200);

// Начальные снежинки
for(let i = 0; i < 30; i++) {
    setTimeout(() => createSnowflake(), i * 100);
}
</script>
